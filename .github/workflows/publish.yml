name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for a release that is already out, such as v1.0.0)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi  # Must match the environment named in the PyPI trusted publisher
    permissions:
      id-token: write  # What PyPI's trusted publishing authenticates with; no API token is stored
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Check the tag matches the package version
        run: |
          pkg=$(python -c "import primer_finder; print(primer_finder.__version__)")
          tag="${TAG#v}"
          test "$pkg" = "$tag" || { echo "::error::tag $tag != __version__ $pkg"; exit 1; }
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
      - uses: pypa/gh-action-pypi-publish@release/v1
