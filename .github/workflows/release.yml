name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Check the tag matches the package version
        run: |
          pkg=$(python -c "import primer_finder; print(primer_finder.__version__)")
          proj=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          test "$pkg" = "$tag" || { echo "::error::tag $tag != __version__ $pkg"; exit 1; }
          test "$proj" = "$tag" || { echo "::error::tag $tag != pyproject version $proj"; exit 1; }
      - name: Extract release notes from CHANGELOG.md
        run: |
          python - <<'PY' > notes.md
          import os, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md").read()
          m = re.search(rf"## {re.escape(version)}[^\n]*\n(.*?)(?=\n## |\Z)", text, re.S)
          print(m.group(1).strip() if m else f"Release {version}")
          PY
      - uses: softprops/action-gh-release@v3
        with:
          name: primer-finder ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
