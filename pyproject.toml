[build-system]
requires = ["setuptools>=77"]  # SPDX license metadata
build-backend = "setuptools.build_meta"

[project]
name = "primer-finder"
# Static on purpose: tests/test_cli.py keeps this in sync with primer_finder.__version__,
# CITATION.cff, CHANGELOG.md and the conda recipe.
version = "1.5.0"
description = "Find group-specific kmers to design selective qPCR assays."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marc-Olivier Duceppe" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["bioinformatics", "qPCR", "primer design", "kmer", "diagnostics"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=5", "ruff", "pre-commit"]

[project.urls]
Homepage = "https://github.com/duceppemo/primer-finder"
Documentation = "https://github.com/duceppemo/primer-finder/wiki"
Changelog = "https://github.com/duceppemo/primer-finder/blob/main/CHANGELOG.md"

[project.scripts]
primer-finder = "primer_finder.cli:main"

[tool.setuptools]
packages = ["primer_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["tools: needs the external programs (kmc, skesa, minimap2, blast) on PATH"]

[tool.coverage.run]
source = ["primer_finder"]

[tool.ruff]
line-length = 115
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
